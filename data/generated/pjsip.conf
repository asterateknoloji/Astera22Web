;========================================================
; ASTERA / Asterisk 22 - çoklu firma
;========================================================

[global]
type=global
user_agent=Asterisk-22-Astera
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
allow_reload=true
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
allow_reload=true
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
allow_reload=true
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.pem
method=tlsv1

[transport-ws]
type=transport
protocol=ws
allow_reload=true
bind=0.0.0.0:5061

[transport-wss]
type=transport
protocol=wss
allow_reload=true
bind=0.0.0.0:5061

[endpoint-basic](!)
type=endpoint
disallow=all
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
language=en
transport=transport-udp

[endpoint-webrtc](!)
type=endpoint
disallow=all
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
language=en
webrtc=yes
dtls_auto_generate_cert=yes
rtcp_mux=yes
use_avpf=yes
ice_support=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
media_use_received_transport=yes
bundle=yes
max_audio_streams=10

#include pjsip_endpoints.conf
#include pjsip_trunks.conf
