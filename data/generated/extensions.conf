 same => n(dnd),Playback(silence/1)
 same => n,Hangup()
 same => n(cfwd),Goto(int-genel,${CF},1)

exten => 1003,hint,PJSIP/1003
exten => 1003,1,Set(ASTERA_RECORD_DEST=1003)
 same => n,Set(ASTERA_RECORD_ENABLED=1)
 same => n,Set(ASTERA_RECORD_FORMAT=wav)
 same => n,Set(ASTERA_RECORD_DIRECTION=${IF($["${ASTERA_RECORD_DIRECTION}" = ""]?dahili:${ASTERA_RECORD_DIRECTION})})
 same => n,Set(ASTERA_RECORD_TYPE=dahili)
 same => n,Set(ASTERA_RECORD_INTERNAL=1003)
