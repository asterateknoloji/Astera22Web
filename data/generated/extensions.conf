; ASTERA dialplan — her firma ayrı context
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

;========== firma genel — diğer firmalara include YOK ==========
[sub-genel]
exten => s,1,Set(CHANNEL(accountcode)=genel)
 same => n,Set(CDR(userfield)=${IF($["${ASTERA_TRANSFER_AUDIT}" != ""]?${ASTERA_TRANSFER_AUDIT}:genel)})
 same => n,Set(CDR(accountcode)=genel)
 same => n,Set(CDR(cnum)=${CALLERID(num)})
 same => n,Set(CDR(cnam)=${CALLERID(name)})
 same => n,ExecIf($["${ASTERA_DID}" != ""]?Set(CDR(did)=${ASTERA_DID}))
 same => n,Set(__ASTERA_TRANSFER_DISPLAY=${IF($["${ASTERA_TRANSFER_DISPLAY}" = ""]?${CALLERID(num)}:${ASTERA_TRANSFER_DISPLAY})})
 same => n,Set(__ASTERA_TRANSFER_NAME=${IF($["${ASTERA_TRANSFER_NAME}" = ""]?${CALLERID(name)}:${ASTERA_TRANSFER_NAME})})
 same => n,Set(DB(ATXFER/${CHANNEL(linkedid)})=${ASTERA_TRANSFER_DISPLAY})
 same => n,Set(DB(ATXFERNAME/${CHANNEL(linkedid)})=${ASTERA_TRANSFER_NAME})
 same => n,Set(__TRANSFER_CONTEXT=atxfer-genel)
 same => n,GotoIf($[${DB_EXISTS(BL/genel/${CALLERID(num)})}]?deny)
 same => n,Set(ASTERA_RECORD_ENABLED=${IF($["${ASTERA_RECORD_ENABLED}" = ""]?1:${ASTERA_RECORD_ENABLED})})
 same => n,GotoIf($["${ASTERA_RECORD_ENABLED}" != "1"]?recorddone)
 same => n,GotoIf($["${ASTERA_SKIP_RECORD}" = "1"]?recorddone)
 same => n,Set(ASTERA_RECORD_DIRECTION=${IF($["${ASTERA_RECORD_DIRECTION}" = ""]?dahili:${ASTERA_RECORD_DIRECTION})})
 same => n,Set(ASTERA_RECORD_TYPE=${IF($["${ASTERA_RECORD_TYPE}" = ""]?dahili:${ASTERA_RECORD_TYPE})})
 same => n,Set(ASTERA_RECORD_FORMAT=${IF($["${ASTERA_RECORD_FORMAT}" = ""]?wav:${ASTERA_RECORD_FORMAT})})
 same => n,Set(ASTERA_RECORD_INTERNAL=${FILTER(0-9A-Za-z_,${ASTERA_RECORD_INTERNAL})})
 same => n,Set(ASTERA_RECORD_EXTERNAL=${FILTER(0-9A-Za-z_,${ASTERA_RECORD_EXTERNAL})})
 same => n,Set(ASTERA_MON_DIR=/var/spool/asterisk/monitor/genel/${STRFTIME(${EPOCH},,%Y)}/${STRFTIME(${EPOCH},,%m)}/${STRFTIME(${EPOCH},,%d)})
 same => n,System(/bin/mkdir -p ${ASTERA_MON_DIR})
 same => n,Set(ASTERA_RECORD_FILE=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-yon_${ASTERA_RECORD_DIRECTION}-tip_${ASTERA_RECORD_TYPE}-dahili_${ASTERA_RECORD_INTERNAL}-numara_${ASTERA_RECORD_EXTERNAL}-uid_${UNIQUEID}.${ASTERA_RECORD_FORMAT})
 same => n,Set(CDR(recordingfile)=${STRFTIME(${EPOCH},,%Y)}/${STRFTIME(${EPOCH},,%m)}/${STRFTIME(${EPOCH},,%d)}/${ASTERA_RECORD_FILE})
 same => n,MixMonitor(${ASTERA_MON_DIR}/${ASTERA_RECORD_FILE},b)
 same => n(recorddone),NoOp(Kayit tercihi uygulandi)
 same => n,Return()
 same => n(deny),Playback(ss-noservice)
 same => n,Hangup()

exten => transfer-preserve,1,NoOp(Aktarim arayan kimligi korunuyor)
 same => n,Set(__ASTERA_TRANSFER_DISPLAY=${IF($["${ASTERA_TRANSFER_DISPLAY}" = ""]?${CALLERID(num)}:${ASTERA_TRANSFER_DISPLAY})})
 same => n,Set(__ASTERA_TRANSFER_NAME=${IF($["${ASTERA_TRANSFER_NAME}" = ""]?${CALLERID(name)}:${ASTERA_TRANSFER_NAME})})
 same => n,Set(__TRANSFER_CONTEXT=atxfer-genel)
 same => n,Set(DB(ATXFER/${CHANNEL(linkedid)})=${ASTERA_TRANSFER_DISPLAY})
 same => n,Set(DB(ATXFERNAME/${CHANNEL(linkedid)})=${ASTERA_TRANSFER_NAME})
 same => n,ExecIf($["${ASTERA_TRANSFER_DISPLAY}" != ""]?Set(CALLERID(num)=${ASTERA_TRANSFER_DISPLAY}))
 same => n,ExecIf($["${ASTERA_TRANSFER_NAME}" != ""]?Set(CALLERID(name)=${ASTERA_TRANSFER_NAME}))
 same => n,ExecIf($["${ASTERA_TRANSFER_DISPLAY}" != ""]?Set(CONNECTEDLINE(num,i)=${ASTERA_TRANSFER_DISPLAY}))
 same => n,ExecIf($["${ASTERA_TRANSFER_NAME}" != ""]?Set(CONNECTEDLINE(name,i)=${ASTERA_TRANSFER_NAME}))
 same => n,Return()

[from-genel]
include => int-genel
include => out-genel
include => feat-genel
include => parked-genel

[int-genel]
exten => 1001,hint,PJSIP/1001
exten => 1001,1,Set(ASTERA_RECORD_DEST=1001)
 same => n,Set(ASTERA_RECORD_ENABLED=1)
 same => n,Set(ASTERA_RECORD_FORMAT=wav)
 same => n,Set(ASTERA_RECORD_DIRECTION=${IF($["${ASTERA_RECORD_DIRECTION}" = ""]?dahili:${ASTERA_RECORD_DIRECTION})})
 same => n,Set(ASTERA_RECORD_TYPE=dahili)
 same => n,Set(ASTERA_RECORD_INTERNAL=1001)
 same => n,Set(ASTERA_RECORD_EXTERNAL=${IF($["${ASTERA_RECORD_EXTERNAL}" = ""]?${CALLERID(num)}:${ASTERA_RECORD_EXTERNAL})})
 same => n,Gosub(sub-genel,s,1)
 same => n,Set(CHANNEL(language)=en)
 same => n,GotoIf($["${DB(DND/genel/1001)}" = "YES"]?dnd)
 same => n,Set(CF=${DB(CF/genel/1001)})
 same => n,GotoIf($["${CF}" != ""]?cfwd)
 same => n,Set(DIALCONTACTS=${PJSIP_DIAL_CONTACTS(1001)})
 same => n,Dial(${DIALCONTACTS},30,tTrb(sub-genel^transfer-preserve^1))
 same => n,Hangup()
 same => n(dnd),Playback(silence/1)
 same => n,Hangup()
 same => n(cfwd),Goto(int-genel,${CF},1)

